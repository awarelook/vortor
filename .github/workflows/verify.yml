name: verify

# Reproducibility gate for the FTGB jewel: runs the entire math model (verify_all.py)
# on a clean machine, on every push and PR. A green check = all 44 checks reproduce from
# scratch, deterministically, with no network. This is the posterity guarantee: the model
# is not "44/44 on the author's machine" but "44/44, verifiably, anywhere."

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (the tested interpreter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (exact tested versions)
        run: |
          python -m pip install --upgrade pip
          # Pinned lock for reproducibility -- these are the versions verify_all is 44/44 on.
          python -m pip install "numpy==2.4.6" "mpmath==1.3.0"

      - name: Reproduce the entire model (must exit 0 = all checks pass)
        run: python results/verify/verify_all.py
